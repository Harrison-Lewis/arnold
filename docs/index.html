function showRoutineDetail(routineId){
  const all=getAllRoutines();
  const r=all.find(x=>x.id===routineId);
  if(!r)return;
  const modal=document.getElementById('routine-modal');
  const content=document.getElementById('routine-modal-content');

  let html=`<div class="flex justify-between items-center mb-12"><h2 style="margin:0">${r.name}</h2>${r.preset?'<span class="badge">Preset</span>':''}</div>`;
  html+=`<div class="routine-detail-exercises">`;
  r.exercises.forEach(e=>{
    const ex=EXERCISE_MAP[e.exerciseId];
    html+=`<div class="routine-detail-ex"><div style="font-weight:600">${ex?ex.name:e.exerciseId}</div><div class="routine-detail-meta">${e.sets} sets \u00d7 ${e.reps} reps @ RPE ${e.rpe}</div></div>`;
  });
  html+=`</div>`;

  html+=`<div class="flex gap-8 mt-16">`;
  html+=`<button class="btn btn-primary" style="flex:1" onclick="startRoutine('${r.id}');document.getElementById('routine-modal').classList.remove('show')">Start</button>`;
  html+=`<button class="btn btn-secondary" onclick="editRoutineOrPreset('${r.id}');document.getElementById('routine-modal').classList.remove('show')">Edit</button>`;
  if(!r.preset){
    html+=`<button class="btn btn-secondary" style="color:var(--danger)" onclick="deleteRoutine('${r.id}');document.getElementById('routine-modal').classList.remove('show')">Delete</button>`;
  }
  html+=`</div>`;

  content.innerHTML=html;
  modal.classList.add('show');
}

function duplicateRoutine(id){
  const all=getAllRoutines();
  const r=all.find(x=>x.id===id);
  if(!r)return;
  const custom=getRoutines();
  const newR={id:'custom-'+Date.now(),name:r.name+' (Copy)',preset:false,exercises:JSON.parse(JSON.stringify(r.exercises))};
  custom.push(newR);
  saveRoutines(custom);
  showToast('Routine duplicated');
  renderRoutines();
}

function deleteRoutine(id){
  let custom=getRoutines();
  custom=custom.filter(r=>r.id!==id);
  saveRoutines(custom);
  showToast('Routine deleted');
  renderRoutines();
}

function editRoutine(id){
  const custom=getRoutines();
  const r=custom.find(x=>x.id===id);
  if(!r)return;
  editingRoutineId=id;
  builderName=r.name;
  builderExercises=JSON.parse(JSON.stringify(r.exercises));
  routineBuilderActive=true;
  renderRoutines();
}

function editRoutineOrPreset(id){
  const all=getAllRoutines();
  const r=all.find(x=>x.id===id);
  if(!r)return;
  // If it's an unmodified preset, clone it into custom storage with the same ID so it overrides
  const custom=getRoutines();
  if(!custom.find(c=>c.id===id)){
    const clone={id:r.id,name:r.name,preset:false,exercises:JSON.parse(JSON.stringify(r.exercises))};
    custom.push(clone);
    saveRoutines(custom);
  }
  editingRoutineId=id;
  const target=getRoutines().find(c=>c.id===id);
  builderName=target.name;
  builderExercises=JSON.parse(JSON.stringify(target.exercises));
  routineBuilderActive=true;
  go('routines');
}

function startBuilder(){
  editingRoutineId=null;
  builderName='';
  builderExercises=[];
  routineBuilderActive=true;
  renderRoutines();
}

let builderSearch='';
function renderRoutineBuilder(el){
  let html=`<div class="back-btn" onclick="routineBuilderActive=false;renderRoutines()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</div>`;
  html+=`<h2>${editingRoutineId?'Edit':'Create'} Routine</h2>`;
  html+=`<input type="text" value="${builderName}" placeholder="Routine name" style="width:100%;padding:14px 16px;background:var(--input);border-radius:12px;font-size:16px;font-weight:600;margin-bottom:16px;border:1px solid transparent" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='transparent'" oninput="builderName=this.value">`;

  // Current exercises
  if(builderExercises.length>0){
    builderExercises.forEach((be,i)=>{
      const ex=EXERCISE_MAP[be.exerciseId];
      html+=`<div class="builder-ex"><div class="builder-ex-info"><div class="builder-ex-name">${ex?ex.name:be.exerciseId}</div><div class="text-xs text-muted">${ex?ex.muscle:''}</div></div>`;
      html+=`<div class="builder-inputs"><input type="number" value="${be.sets}" min="1" max="10" placeholder="Sets" onchange="builderExercises[${i}].sets=+this.value"><input type="text" value="${be.reps}" placeholder="Reps" style="width:70px" onchange="builderExercises[${i}].reps=this.value"><select onchange="builderExercises[${i}].rpe=+this.value">${[6,7,8,9,10].map(v=>`<option value="${v}"${v===be.rpe?' selected':''}>${v}</option>`).join('')}</select></div>`;
      html+=`<div class="builder-remove" onclick="builderExercises.splice(${i},1);renderRoutines()">\u00d7</div></div>`;
    });
  }

  // Search to add — input calls updateBuilderSearch(), NOT renderRoutines(), to avoid focus loss
  html+=`<div class="search-bar mt-12"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="builder-search" type="text" placeholder="Search to add exercise..." autocomplete="off" oninput="updateBuilderSearch(this.value)"></div>`;
  html+=`<div id="builder-results"></div>`;
  html+=`<button class="btn btn-primary btn-block mt-24" onclick="saveBuilder()">${editingRoutineId?'Update':'Save'} Routine</button>`;
  el.innerHTML=html;
  // Restore search results if there was a prior search (e.g. after adding an exercise)
  if(builderSearch)updateBuilderSearch(builderSearch,true);
}

function addToBuilder(exId){
  builderExercises.push({exerciseId:exId,sets:3,reps:'10-12',rpe:8});
  builderSearch='';
  renderRoutines();
}

// Updates only the builder search results div — never the input, so focus is kept
function updateBuilderSearch(val,restoreOnly){
  builderSearch=val;
  const container=document.getElementById('builder-results');
  if(!container)return;
  if(val.length<2){container.innerHTML='';return}
  const results=getAllExercises().filter(e=>e.name.toLowerCase().includes(val.toLowerCase())).slice(0,10);
  let html='';
  results.forEach(ex=>{
    html+=`<div class="ex-card" style="margin:0 0 4px;border-radius:10px;background:var(--input)" onclick="addToBuilder('${ex.id}')"><div><div class="ex-card-name">${ex.name}</div><div class="ex-card-meta">${ex.equip}</div></div><span class="badge">${ex.muscle}</span></div>`;
  });
  container.innerHTML=html;
  // Restore input value when builder is freshly rendered with an existing search
  if(restoreOnly){const inp=document.getElementById('builder-search');if(inp)inp.value=val;}
}

/* ============================================================
   CUSTOM EXERCISES
   ============================================================ */
function getAllExercises(){
  return[...EXERCISES,...getCustomExercises()];
}

function rebuildExerciseMap(){
  // Clear then repopulate — merges built-in + user-created exercises
  Object.keys(EXERCISE_MAP).forEach(k=>delete EXERCISE_MAP[k]);
  getAllExercises().forEach(e=>EXERCISE_MAP[e.id]=e);
}

function showCreateExModal(){
  const modal=document.getElementById('create-ex-modal');
  document.getElementById('new-ex-name').value='';
  document.getElementById('new-ex-muscle').value='Chest';
  document.getElementById('new-ex-equip').value='Barbell';
  document.getElementById('new-ex-inc').value='2.5';
  modal.classList.add('show');
  setTimeout(()=>document.getElementById('new-ex-name').focus(),100);
}

function saveNewExercise(){
  const name=document.getElementById('new-ex-name').value.trim();
  if(!name){showToast('Enter an exercise name');return}
  const muscle=document.getElementById('new-ex-muscle').value;
  const equip=document.getElementById('new-ex-equip').value;
  const inc=+document.getElementById('new-ex-inc').value;
  const id='custom-'+Date.now();
  const custom=getCustomExercises();
  custom.push({id,name,muscle,equip,inc});
  saveCustomExercises(custom);
  rebuildExerciseMap();
  document.getElementById('create-ex-modal').classList.remove('show');
  showToast('Exercise added to library');
  // Refresh library if currently shown
  const libResults=document.getElementById('lib-results');
  if(libResults)renderLibResults();
}

function deleteCustomExercise(id){
  if(!confirm('Delete this exercise?'))return;
  let custom=getCustomExercises();
  custom=custom.filter(e=>e.id!==id);
  saveCustomExercises(custom);
  rebuildExerciseMap();
  libDetail=null;
  renderLibrary();
  showToast('Exercise deleted');
}

function saveBuilder(){
  if(!builderName.trim()){showToast('Enter a routine name');return}
  if(builderExercises.length===0){showToast('Add at least one exercise');return}
  let custom=getRoutines();
  if(editingRoutineId){
    const idx=custom.findIndex(r=>r.id===editingRoutineId);
    if(idx>=0){custom[idx].name=builderName;custom[idx].exercises=builderExercises}
  }else{
    custom.push({id:'custom-'+Date.now(),name:builderName,preset:false,exercises:builderExercises});
  }
  saveRoutines(custom);
  routineBuilderActive=false;
  editingRoutineId=null;
  showToast('Routine saved');
  renderRoutines();
}

/* ============================================================
   START WORKOUT
   ============================================================ */
function startRoutine(routineId){
  const all=getAllRoutines();
  const r=all.find(x=>x.id===routineId);
  if(!r)return;

  const workout={
    routineId:r.id,
    routineName:r.name,
    startTime:Date.now(),
    date:new Date().toISOString(),
    exercises:r.exercises.map(e=>{
      const rec=getOverloadRec(e.exerciseId,e.reps,e.rpe);
      const last=getLastPerformance(e.exerciseId);
      return{
        exerciseId:e.exerciseId,
        exerciseName:(EXERCISE_MAP[e.exerciseId]||{}).name||e.exerciseId,
        targetSets:e.sets,
        targetReps:e.reps,
        targetRPE:e.rpe,
        recommendation:rec,
        lastPerformance:last,
        sets:Array.from({length:e.sets},()=>({weight:rec.weight||0,reps:rec.reps||0,rpe:e.rpe,completed:false}))
      };
    })
  };
  saveActive(workout);
  go('log');
}

/* ============================================================
   SCREEN: LOG (WORKOUT LOGGER)
   ============================================================ */
let timerInterval=null;let timerEndAt=0;let timerDuration=90;let timerRemaining=90;
let workoutTimerInterval=null;

function renderLog(){
  const el=document.getElementById('screen-log');
  const active=getActive();

  if(!active){
    el.innerHTML=`<h2>Workout Log</h2><div class="empty-state"><svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg><p>No active workout</p><p class="text-xs text-muted mt-8">Start a routine from the Routines or Home screen</p></div>`;
    stopWorkoutTimer();
    return;
  }

  if(active.startTime)startWorkoutTimer(active.startTime);

  timerDuration=getTimerDur();
  let totalSets=0,completedSets=0;
  active.exercises.forEach(ex=>{totalSets+=ex.sets.length;ex.sets.forEach(s=>{if(s.completed)completedSets++})});
  const pct=totalSets>0?Math.round(completedSets/totalSets*100):0;

  let html=`<div class="log-progress"><div class="flex justify-between items-center mb-8"><h2 style="margin:0">${active.routineName}</h2></div>`;
  html+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  html+=`<div class="progress-text">${completedSets} of ${totalSets} sets completed (${pct}%)</div></div>`;

  active.exercises.forEach((ex,ei)=>{
    const exInfo=EXERCISE_MAP[ex.exerciseId];
    const exType=exInfo?exInfo.type:'standard';
    html+=`<div class="log-exercise"><div class="log-exercise-header"><div onclick="showExPopup('${ex.exerciseId}')" style="flex:1;cursor:pointer"><div class="log-exercise-name">${ex.exerciseName}</div><div class="log-exercise-target">${ex.targetSets} sets \u00d7 ${ex.targetReps} reps @ RPE ${ex.targetRPE}</div></div><div class="flex gap-8 items-center"><button class="log-ex-action" onclick="openMidWorkoutPicker('swap',${ei})" title="Swap exercise"><svg viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></button><button class="log-ex-action danger" onclick="removeMidWorkoutEx(${ei})" title="Remove exercise"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div></div>`;

    // Last performance
    if(ex.lastPerformance){
      if(exType==='cardio'){
        const best=ex.lastPerformance.sets[0]||{};
        html+=`<div class="log-last">Last: ${best.weight||0}km \u00d7 ${best.reps||0}min${best.rpe?' RPE '+best.rpe:''}</div>`;
      } else if(exType==='bw'){
        const best=ex.lastPerformance.sets.reduce((b,s)=>Math.abs(s.weight||0)>=Math.abs(b.weight||0)?s:b,ex.lastPerformance.sets[0]);
        const wDisp=best.weight>0?`+${displayW(best.weight)}`:best.weight<0?`${displayW(best.weight)}`:'-';
        html+=`<div class="log-last">Last: ${wDisp}${unitLabel()} \u00d7 ${best.reps} reps${best.rpe?' RPE '+best.rpe:''}</div>`;
      } else {
        const best=ex.lastPerformance.sets.reduce((b,s)=>(s.weight>=b.weight)?s:b,ex.lastPerformance.sets[0]);
        html+=`<div class="log-last">Last: ${displayW(best.weight)}${unitLabel()} \u00d7 ${best.reps} reps${best.rpe?' RPE '+best.rpe:''}</div>`;
      }
    }

    // Recommendation
    const rec=ex.recommendation;
    if(rec){
      const cls=rec.type==='deload'?'danger':rec.type==='hold'?'warn':'';
      html+=`<div class="log-rec ${cls}">${rec.text}</div>`;
    }

    // Set header
    if(exType==='cardio'){
      html+=`<div class="set-row" style="margin-bottom:4px"><div class="text-xs text-muted">#</div><div class="text-xs text-muted">km</div><div class="text-xs text-muted">min</div><div class="text-xs text-muted">RPE</div><div></div></div>`;
    } else if(exType==='bw'){
      html+=`<div class="set-row" style="margin-bottom:4px"><div class="text-xs text-muted">#</div><div class="text-xs text-muted">+/−${unitLabel()}</div><div class="text-xs text-muted">Reps</div><div class="text-xs text-muted">RPE</div><div></div></div>`;
    } else {
      html+=`<div class="set-row" style="margin-bottom:4px"><div class="text-xs text-muted">#</div><div class="text-xs text-muted">${unitLabel()}</div><div class="text-xs text-muted">Reps</div><div class="text-xs text-muted">RPE</div><div></div></div>`;
    }

    // Sets
    const wStep=getUnit()==='lbs'?1:0.5;
    ex.sets.forEach((s,si)=>{
      html+=`<div class="set-row"><div class="set-label">${si+1}</div>`;
      if(exType==='cardio'){
        // weight field = distance (km), reps field = duration (min) — no unit conversion
        html+=`<input class="set-input" type="number" step="0.1" min="0" value="${s.weight||''}" placeholder="0" onchange="updateSet(${ei},${si},'weight',+this.value)">`;
        html+=`<input class="set-input" type="number" min="0" value="${s.reps||''}" placeholder="0" onchange="updateSet(${ei},${si},'reps',+this.value)">`;
      } else if(exType==='bw'){
        // allow negative (assisted) and positive (weighted)
        const dispW=s.weight?displayW(s.weight):'';
        html+=`<input class="set-input" type="number" step="${wStep}" value="${dispW}" placeholder="0" onchange="updateSet(${ei},${si},'weight',storeW(+this.value))">`;
        html+=`<input class="set-input" type="number" min="0" value="${s.reps||''}" placeholder="0" onchange="updateSet(${ei},${si},'reps',+this.value)">`;
      } else {
        const dispW=s.weight?displayW(s.weight):'';
        html+=`<input class="set-input" type="number" step="${wStep}" min="0" value="${dispW}" placeholder="0" onchange="updateSet(${ei},${si},'weight',storeW(+this.value))">`;
        html+=`<input class="set-input" type="number" min="0" value="${s.reps||''}" placeholder="0" onchange="updateSet(${ei},${si},'reps',+this.value)">`;
      }
      html+=`<select class="rpe-select" onchange="updateSet(${ei},${si},'rpe',+this.value)">${[6,7,8,9,10].map(v=>`<option value="${v}"${v===s.rpe?' selected':''}>${v}</option>`).join('')}</select>`;
      html+=`<div class="set-check${s.completed?' done':''}" onclick="toggleSet(${ei},${si})"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div>`;

      // Regression warning: compare set N against set N last session only (not the peak set)
      if(s.completed&&ex.lastPerformance&&exType!=='cardio'){
        const prev=ex.lastPerformance.sets[si];
        if(prev&&(s.weight<prev.weight||s.reps<prev.reps)){
          html+=`<div class="text-xs text-warn" style="padding-left:40px;margin-top:-4px;margin-bottom:4px">Below last session's set ${si+1}</div>`;
        }
      }
    });
    html+=`<div class="log-sets-controls"><button class="btn btn-sm btn-secondary" onclick="addSetToEx(${ei})">+ Set</button><button class="btn btn-sm btn-secondary" onclick="removeSetFromEx(${ei})"${ex.sets.length<=1?' style="opacity:.4"':''}>&#8722; Set</button></div>`;
    html+=`</div>`;
  });

  html+=`<button class="btn btn-primary btn-block mt-16" onclick="finishWorkout()">Finish Workout</button>`;
  html+=`<button class="btn btn-secondary btn-block mt-8" onclick="openMidWorkoutPicker('add',-1)">+ Add Exercise</button>`;
  html+=`<button class="btn btn-secondary btn-block mt-8 btn-destructive" onclick="if(confirm('Discard this workout?')){clearActive();renderLog()}">Discard Workout</button>`;
  html+=`<div style="height:40px"></div>`;
  el.innerHTML=html;
}

function updateSet(ei,si,field,value){
  const active=getActive();
  if(!active)return;
  active.exercises[ei].sets[si][field]=value;
  saveActive(active);
}

function toggleSet(ei,si){
  const active=getActive();
  if(!active)return;
  const s=active.exercises[ei].sets[si];
  s.completed=!s.completed;
  saveActive(active);
  renderLog();
  if(s.completed)startRestTimer();
}

/* REST TIMER */
function startRestTimer(){
  timerDuration=getTimerDur();
  timerEndAt=Date.now()+timerDuration*1000;
  const el=document.getElementById('rest-timer');
  el.classList.add('show');
  document.getElementById('timer-pill').classList.remove('show');
  timerRemaining=timerDuration;
  // init ring (no transition on first render)
  const prog=document.getElementById('timer-ring-progress');
  if(prog){const r=80;const circ=2*Math.PI*r;prog.style.transition='none';prog.style.strokeDasharray=circ;prog.style.strokeDashoffset=0;requestAnimationFrame(()=>{prog.style.transition='stroke-dashoffset .9s linear,stroke .5s';});}
  if(navigator.vibrate)navigator.vibrate([40]);
  updateTimerDisplay();
  updateTimerDurButtons();
  clearInterval(timerInterval);
  timerInterval=setInterval(tickRestTimer,500);
}

function tickRestTimer(){
  const remaining=Math.ceil((timerEndAt-Date.now())/1000);
  if(remaining<=0){skipTimer();showToast('Rest complete \u2014 next set!');}
  else{timerRemaining=remaining;updateTimerDisplay();}
}

function updateTimerDisplay(){
  const m=Math.floor(timerRemaining/60);
  const s=timerRemaining%60;
  const txt=`${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('timer-display').textContent=txt;
  document.getElementById('pill-display').textContent=txt;
  // SVG ring
  const prog=document.getElementById('timer-ring-progress');
  if(prog){
    const r=80;const circ=2*Math.PI*r;
    const frac=timerDuration>0?Math.max(0,timerRemaining/timerDuration):0;
    prog.style.strokeDasharray=circ;
    prog.style.strokeDashoffset=circ*(1-frac);
    // green shift when ≤10s, haptic at 10s exactly
    if(timerRemaining<=10){
      prog.style.stroke='#34C759';
      if(timerRemaining===10&&navigator.vibrate)navigator.vibrate([100]);
    } else {
      prog.style.stroke='var(--accent)';
    }
  }
}

function updateTimerDurButtons(){
  document.querySelectorAll('.timer-dur button').forEach(b=>{
    b.classList.toggle('active',parseInt(b.textContent)===timerDuration);
  });
}

function setTimerDur(d){
  timerDuration=d;
  setTimerDurPref(d);
  timerEndAt=Date.now()+d*1000;
  timerRemaining=d;
  updateTimerDisplay();
  updateTimerDurButtons();
}

function skipTimer(){
  clearInterval(timerInterval);
  timerEndAt=0;
  document.getElementById('rest-timer').classList.remove('show');
  document.getElementById('timer-pill').classList.remove('show');
}

function minimiseTimer(){
  document.getElementById('rest-timer').classList.remove('show');
  document.getElementById('timer-pill').classList.add('show');
}

function restoreTimer(){
  document.getElementById('rest-timer').classList.add('show');
  document.getElementById('timer-pill').classList.remove('show');
}

/* MID-WORKOUT EXERCISE MANAGEMENT */
let midPickerMode='add';let midPickerTargetIdx=-1;

function openMidWorkoutPicker(mode,idx){
  midPickerMode=mode;midPickerTargetIdx=idx;
  document.getElementById('mid-picker-title').textContent=mode==='swap'?'Swap Exercise':'Add Exercise';
  const inp=document.getElementById('mid-picker-search');
  inp.value='';
  updateMidPickerSearch('');
  document.getElementById('mid-workout-picker').classList.add('show');
  setTimeout(()=>inp.focus(),150);
}

function closeMidWorkoutPicker(){
  document.getElementById('mid-workout-picker').classList.remove('show');
}

function updateMidPickerSearch(val){
  const container=document.getElementById('mid-picker-results');
  if(!container)return;
  const all=getAllExercises();
  const results=val.length>=1?all.filter(e=>e.name.toLowerCase().includes(val.toLowerCase())||e.muscle.toLowerCase().includes(val.toLowerCase())):all.slice(0,30);
  container.innerHTML=results.slice(0,30).map(e=>
    `<div class="ex-card" style="margin:0 0 4px;border-radius:10px;background:var(--input)" onclick="selectMidWorkoutEx('${e.id}')"><div><div class="ex-card-name">${e.name}</div><div class="ex-card-meta">${e.equip}</div></div><span class="badge">${e.muscle}</span></div>`
  ).join('');
}

function selectMidWorkoutEx(exId){
  closeMidWorkoutPicker();
  if(midPickerMode==='swap')swapActiveEx(midPickerTargetIdx,exId);
  else addActiveEx(exId);
}

function swapActiveEx(idx,newExId){
  const active=getActive();if(!active)return;
  const old=active.exercises[idx];
  const rec=getOverloadRec(newExId,old.targetReps,old.targetRPE);
  const last=getLastPerformance(newExId);
  active.exercises[idx]={
    exerciseId:newExId,
    exerciseName:(EXERCISE_MAP[newExId]||{}).name||newExId,
    targetSets:old.targetSets,targetReps:old.targetReps,targetRPE:old.targetRPE,
    recommendation:rec,lastPerformance:last,
    sets:Array.from({length:old.targetSets},()=>({weight:rec.weight||0,reps:rec.reps||0,rpe:old.targetRPE,completed:false}))
  };
  saveActive(active);renderLog();
}

function addActiveEx(exId){
  const active=getActive();if(!active)return;
  const rec=getOverloadRec(exId,'8-10',8);
  const last=getLastPerformance(exId);
  active.exercises.push({
    exerciseId:exId,exerciseName:(EXERCISE_MAP[exId]||{}).name||exId,
    targetSets:3,targetReps:'8-10',targetRPE:8,
    recommendation:rec,lastPerformance:last,
    sets:Array.from({length:3},()=>({weight:rec.weight||0,reps:rec.reps||0,rpe:8,completed:false}))
  });
  saveActive(active);renderLog();
}

function removeMidWorkoutEx(idx){
  const active=getActive();if(!active)return;
  if(active.exercises.length<=1){showToast('Need at least one exercise');return}
  if(!confirm(`Remove ${active.exercises[idx].exerciseName}?`))return;
  active.exercises.splice(idx,1);
  saveActive(active);renderLog();
}

function addSetToEx(idx){
  const active=getActive();if(!active)return;
  const ex=active.exercises[idx];
  const last=ex.sets[ex.sets.length-1]||{weight:0,reps:0,rpe:ex.targetRPE};
  ex.sets.push({weight:last.weight,reps:last.reps,rpe:last.rpe,completed:false});
  ex.targetSets=ex.sets.length;
  saveActive(active);renderLog();
}

function removeSetFromEx(idx){
  const active=getActive();if(!active)return;
  const ex=active.exercises[idx];
  if(ex.sets.length<=1){showToast('Need at least 1 set');return}
  ex.sets.pop();
  ex.targetSets=ex.sets.length;
  saveActive(active);renderLog();
}

/* WORKOUT ELAPSED TIMER */
function startWorkoutTimer(startTime){
  stopWorkoutTimer();
  function updateWTimer(){
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    const h=Math.floor(elapsed/3600);
    const m=Math.floor((elapsed%3600)/60);
    const s=elapsed%60;
    const txt=h>0?`${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`:`${m}:${s.toString().padStart(2,'0')}`;
    const el=document.getElementById('workout-timer-display');
    if(el)el.textContent=txt;
  }
  updateWTimer();
  workoutTimerInterval=setInterval(updateWTimer,1000);
  document.getElementById('workout-timer-pill').classList.add('show');
}

function stopWorkoutTimer(){
  clearInterval(workoutTimerInterval);
  workoutTimerInterval=null;
  const pill=document.getElementById('workout-timer-pill');
  if(pill)pill.classList.remove('show');
}

/* EXERCISE POPUP */
function showExPopup(exId){
  const el=document.getElementById('ex-popup');
  const content=document.getElementById('popup-content');
  const ex=EXERCISE_MAP[exId];
  const hist=getExerciseHistory(exId);

  let html=`<h3>${ex?ex.name:exId}</h3>`;
  if(hist.length===0){
    html+=`<div class="text-sm text-muted mt-12">No history yet</div>`;
  }else{
    // Last 5 sessions
    const recent=hist.slice(-5).reverse();
    recent.forEach(h=>{
      html+=`<div style="padding:8px 0;border-bottom:0.5px solid rgba(60,60,67,0.12)"><div class="text-sm text-muted">${new Date(h.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>`;
      h.sets.forEach((s,i)=>{html+=`<div class="text-sm">Set ${i+1}: ${s.weight}kg \u00d7 ${s.reps}${s.rpe?' @ RPE '+s.rpe:''}</div>`});
      html+=`</div>`;
    });

    // Sparkline 1RM
    if(hist.length>=2){
      html+=`<div class="chart-wrap" style="height:120px;margin-top:12px"><canvas id="popup-chart"></canvas></div>`;
    }
  }
  content.innerHTML=html;
  el.classList.add('show');

  if(hist.length>=2){
    setTimeout(()=>{
      const ctx=document.getElementById('popup-chart');
      if(!ctx)return;
      const data=hist.map(h=>{
        const best=h.sets.reduce((b,s)=>calcE1RM(s.weight,s.reps)>calcE1RM(b.weight,b.reps)?s:b,h.sets[0]);
        return+calcE1RM(best.weight,best.reps).toFixed(1);
      });
      new Chart(ctx,{type:'line',data:{labels:data.map((_,i)=>i+1),datasets:[{data,borderColor:'#007AFF',borderWidth:2,pointRadius:2,tension:.3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:'rgba(60,60,67,.45)',font:{size:10}},grid:{color:'rgba(60,60,67,.08)'}}}}});
    },100);
  }
}

/* ============================================================
   FINISH WORKOUT
   ============================================================ */
function finishWorkout(){
  const active=getActive();
  if(!active)return;

  // Check if any sets completed
  let anyCompleted=false;
  active.exercises.forEach(ex=>ex.sets.forEach(s=>{if(s.completed)anyCompleted=true}));
  if(!anyCompleted){showToast('Complete at least one set first');return}

  active.endTime=Date.now();
  const dur=Math.round((active.endTime-active.startTime)/60000);
  let totalVol=0;
  active.exercises.forEach(ex=>{const ei=EXERCISE_MAP[ex.exerciseId];if(ei&&ei.type==='cardio')return;ex.sets.forEach(s=>{if(s.completed)totalVol+=(s.weight||0)*(s.reps||0)})});

  // Check for personal records
  const prs=[];
  active.exercises.forEach(ex=>{
    const prevPB=getPersonalBest(ex.exerciseId);
    const prevBestE1RM=prevPB?prevPB.e1rm:0;
    ex.sets.forEach(s=>{
      if(s.completed){
        const e1=calcE1RM(s.weight,s.reps);
        if(e1>prevBestE1RM){
          if(!prs.find(p=>p.exId===ex.exerciseId)||e1>prs.find(p=>p.exId===ex.exerciseId).e1rm){
            const existing=prs.findIndex(p=>p.exId===ex.exerciseId);
            const pr={exId:ex.exerciseId,name:ex.exerciseName,e1rm:e1};
            if(existing>=0)prs[existing]=pr;else prs.push(pr);
          }
        }
      }
    });
  });

  // Build summary
  showSummary(active,dur,totalVol,prs);
}

function showSummary(active,dur,totalVol,prs){
  const modal=document.getElementById('summary-modal');
  const d=new Date(active.date);
  const dateStr=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  let html=`<div class="summary-glow"><h2>${active.routineName}</h2><div class="date">${dateStr} \u2022 ${dur} min</div>`;
  html+=`<div class="summary-stats"><div class="summary-stat"><div class="val">${displayW(totalVol).toLocaleString()}<span style="font-size:14px">${unitLabel()}</span></div><div class="label">Volume</div></div>`;

  let completedCount=0;
  active.exercises.forEach(ex=>ex.sets.forEach(s=>{if(s.completed)completedCount++}));
  html+=`<div class="summary-stat"><div class="val">${completedCount}</div><div class="label">Sets</div></div>`;
  html+=`<div class="summary-stat"><div class="val">${active.exercises.length}</div><div class="label">Exercises</div></div></div></div>`;

  // PRs
  if(prs.length>0){
    html+=`<div class="summary-prs"><h4>\u{1f3c6} Personal Records</h4>`;
    prs.forEach(pr=>{
      html+=`<div class="text-sm text-gold">${pr.name} \u2014 new est. 1RM: ${displayW(+pr.e1rm.toFixed(1))}${unitLabel()}</div>`;
    });
    html+=`</div>`;
  }

  // Exercises detail
  html+=`<div class="summary-exercises">`;
  active.exercises.forEach(ex=>{
    const completed=ex.sets.filter(s=>s.completed);
    if(completed.length===0)return;
    html+=`<div class="summary-ex"><h4>${ex.exerciseName}</h4>`;
    completed.forEach((s,i)=>{
      html+=`<div class="summary-set">Set ${i+1}: ${displayW(s.weight)}${unitLabel()} \u00d7 ${s.reps} reps (RPE ${s.rpe})</div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;

  // Buttons
  html+=`<div class="summary-btns"><button class="btn btn-primary" onclick="copyAndFinish()">Copy & Finish</button><button class="btn btn-secondary" onclick="finishWithoutCopy()">Finish</button></div>`;

  document.getElementById('summary-content').innerHTML=html;
  modal.classList.add('show');

  // Store for copy
  window._summaryData={active,dur,totalVol,prs};
}

function buildCopyText(){
  const{active,dur,totalVol,prs}=window._summaryData;
  const d=new Date(active.date);
  const dateStr=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  let txt=`${active.routineName.toUpperCase()} \u2014 ${dateStr} | ${dur} min\n\n`;

  active.exercises.forEach(ex=>{
    const completed=ex.sets.filter(s=>s.completed);
    if(completed.length===0)return;
    txt+=`${ex.exerciseName}\n`;
    completed.forEach((s,i)=>{
      txt+=`  Set ${i+1}: ${displayW(s.weight)}${unitLabel()} \u00d7 ${s.reps} reps (RPE ${s.rpe})\n`;
    });
    txt+=`\n`;
  });

  txt+=`Total Volume: ${displayW(totalVol).toLocaleString()}${unitLabel()}\n`;
  if(prs.length>0){
    txt+=`Personal Records: ${prs.map(p=>`${p.name} (new 1RM: ${displayW(+p.e1rm.toFixed(1))}${unitLabel()})`).join(', ')}\n`;
  }
  return txt;
}

function copyAndFinish(){
  navigator.clipboard.writeText(buildCopyText()).then(()=>{
    showToast('Copied to clipboard!');
  }).catch(()=>{showToast('Copy failed \u2014 try manually')});
  saveAndClose();
}

function finishWithoutCopy(){
  saveAndClose();
}

function saveAndClose(){
  const active=getActive();
  if(!active)return;
  active.endTime=active.endTime||Date.now();
  if(!active.id)active.id=crypto.randomUUID();
  const sessions=getSessions();
  sessions.push(active);
  saveSessions(sessions);
  clearActive();
  stopWorkoutTimer();
  document.getElementById('summary-modal').classList.remove('show');
  go('home');
}

        let vol=0,exCount=0;

        html+=`<div class="session-expand" id="session-${sessions.length-1-idx}">`;

        s.exercises.forEach(ex=>{
          const completed=ex.sets.filter(st=>st.completed);
          if(completed.length===0)return;

          // Compare to previous session of same routine
          const prevSessions=[...sessions].filter(ps=>ps.routineId===s.routineId&&new Date(ps.date)<d);
          let arrow='';
          if(prevSessions.length>0){
            const prevS=prevSessions[prevSessions.length-1];
            const prevEx=prevS.exercises.find(pe=>pe.exerciseId===ex.exerciseId);
            if(prevEx){
              const prevVol=prevEx.sets.filter(st=>st.completed).reduce((v,st)=>v+(st.weight||0)*(st.reps||0),0);
              const curVol=completed.reduce((v,st)=>v+(st.weight||0)*(st.reps||0),0);
              if(curVol>prevVol)arrow='<span class="arrow-up"> \u2191</span>';
              else if(curVol<prevVol)arrow='<span class="arrow-down"> \u2193</span>';
            }

          html+=`<div class="session-ex"><strong>${ex.exerciseName||ex.exerciseId}${arrow}</strong>`;
          completed.forEach((st,i)=>{
            html+=`<div class="session-set">Set ${i+1}: ${displayW(st.weight)}${unitLabel()} \u00d7 ${st.reps}${st.rpe?' @ RPE '+st.rpe:''}</div>`;

        });
        html+=`</div></div>`;
      });
    }
  }else{
    html+=renderDashboard(sessions);
  }

  el.innerHTML=html;

  if(histView==='dashboard'&&sessions.length>0){

  }
}

/* ============================================================
   MUSCLE RECOVERY MODEL
   Science basis: 48h exponential decay (Schoenfeld/Ogborn-Krieger
   meta-analyses — most muscles recover in 48-72h at moderate load).
   Fatigue score = Σ(sets × RPE_intensity × e^(-age_hours/48))
   Normalised so ~6 hard weighted sets = 1.0 (maximally fatigued).
   ============================================================ */
function calcMuscleFatigue(sessions){
  const muscles=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Core'];
  const raw={};muscles.forEach(m=>raw[m]=0);
  const now=Date.now();
  const cutoff=now-7*24*3600000;
  sessions.filter(s=>(s.startTime||0)>cutoff).forEach(s=>{
    const ageH=(now-(s.startTime||now))/3600000;
    const decay=Math.exp(-ageH/48);
    s.exercises.forEach(ex=>{
      const exInfo=EXERCISE_MAP[ex.exerciseId];
      if(!exInfo||!raw.hasOwnProperty(exInfo.muscle))return;
      const done=ex.sets.filter(st=>st.completed);
      if(!done.length)return;
      const avgRPE=done.reduce((a,st)=>a+(st.rpe||8),0)/done.length;
      const intensity=Math.max(0.1,(avgRPE-5)/5); // RPE6→0.2, RPE10→1.0
      raw[exInfo.muscle]+=done.length*intensity*decay;
    });
  });
  const out={};
  muscles.forEach(m=>out[m]=Math.min(raw[m]/6,1)); // 6 weighted sets = max
  return out;
}

function fatigueColor(f){
  f=Math.max(0,Math.min(1,f));
  const stops=[{t:0,r:52,g:199,b:89},{t:0.4,r:255,g:204,b:0},{t:0.7,r:255,g:149,b:0},{t:1,r:255,g:59,b:48}];
  let lo=stops[0],hi=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){if(f>=stops[i].t&&f<=stops[i+1].t){lo=stops[i];hi=stops[i+1];break}}
  const t=lo.t===hi.t?0:(f-lo.t)/(hi.t-lo.t);
  return`rgb(${Math.round(lo.r+(hi.r-lo.r)*t)},${Math.round(lo.g+(hi.g-lo.g)*t)},${Math.round(lo.b+(hi.b-lo.b)*t)})`;
}

function fatigueLabel(f){
  if(f<0.2)return'Recovered';
  if(f<0.45)return'Light';
  if(f<0.7)return'Moderate';
  return'Needs rest';
}

function lastTrainedLabel(muscle,sessions){
  const now=Date.now();
  let latest=null;
  sessions.forEach(s=>s.exercises.forEach(ex=>{
    const exInfo=EXERCISE_MAP[ex.exerciseId];
    if(!exInfo||exInfo.muscle!==muscle)return;
    if(ex.sets.some(st=>st.completed)&&(s.startTime||0)>( latest||0))latest=s.startTime;
  }));
  if(!latest)return'Not recently';
  const h=Math.round((now-latest)/3600000);
  if(h<24)return`${h}h ago`;
  return`${Math.floor(h/24)}d ago`;
}

function renderDashboard(sessions){
  let html='';

  // Stats
  let totalSessions=sessions.length;
  let totalVol=0;
  sessions.forEach(s=>s.exercises.forEach(ex=>ex.sets.forEach(st=>{if(st.completed)totalVol+=(st.weight||0)*(st.reps||0)})));
  const totalTonnes=(totalVol/1000).toFixed(1);

  // Streak calc
  const dates=[...new Set(sessions.map(s=>new Date(s.date).toDateString()))].sort((a,b)=>new Date(b)-new Date(a));
  let currentStreak=0,bestStreak=0,streak=0;
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<365;i++){
    const check=new Date(today);check.setDate(today.getDate()-i);
    if(dates.includes(check.toDateString())){streak++;if(i===0||streak>0)currentStreak=Math.max(currentStreak,streak)}
    else{if(i===0)continue;bestStreak=Math.max(bestStreak,streak);if(currentStreak===0&&streak>0)currentStreak=streak;streak=0}
  }
  bestStreak=Math.max(bestStreak,streak);

  html+=`<div class="stats-row"><div class="stat-box"><div class="stat-val">${totalSessions}</div><div class="stat-label">Sessions</div></div><div class="stat-box"><div class="stat-val">${totalTonnes}t</div><div class="stat-label">Volume</div></div><div class="stat-box"><div class="stat-val">${currentStreak}</div><div class="stat-label">Streak</div></div><div class="stat-box"><div class="stat-val">${bestStreak}</div><div class="stat-label">Best</div></div></div>`;

  // Muscle recovery body map
  html+=renderBodyMap(calcMuscleFatigue(sessions),sessions);

  // Volume chart
  html+=`<div class="card"><h3>Weekly Volume</h3><div class="chart-wrap tall"><canvas id="vol-chart"></canvas></div></div>`;

  // Heatmap
  html+=`<div class="card"><h3>Training Frequency</h3><div class="heatmap" id="heatmap"></div><div class="flex justify-between text-xs text-muted"><span>6 months ago</span><span>Today</span></div></div>`;

  // Top lifts
  const allExHist={};
  sessions.forEach(s=>s.exercises.forEach(ex=>{
    ex.sets.filter(st=>st.completed).forEach(st=>{
      const e1=calcE1RM(st.weight,st.reps);
      if(!allExHist[ex.exerciseId]||e1>allExHist[ex.exerciseId].e1rm){
        allExHist[ex.exerciseId]={name:ex.exerciseName||ex.exerciseId,e1rm:e1,weight:st.weight,reps:st.reps};
      }
    });
  }));

  const topLifts=Object.values(allExHist).sort((a,b)=>b.e1rm-a.e1rm).slice(0,6);
  if(topLifts.length>0){
    html+=`<div class="card"><h3>Top Lifts (Est. 1RM)</h3>`;
    topLifts.forEach(l=>{
      html+=`<div class="flex justify-between items-center" style="padding:8px 0;border-bottom:0.5px solid rgba(60,60,67,0.12)"><div class="text-sm" style="font-weight:600">${l.name}</div><div class="text-accent" style="font-weight:700">${l.e1rm.toFixed(1)}kg</div></div>`;
    });
    html+=`</div>`;
  }

  return html;
}

function renderDashboardCharts(sessions){
  // Volume chart - last 8 weeks
  const today=new Date();
  const weeks=[];
  for(let i=7;i>=0;i--){
    const weekStart=new Date(today);
    weekStart.setDate(today.getDate()-((today.getDay()+6)%7)-i*7);
    weekStart.setHours(0,0,0,0);
    const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+7);
    const groups={};
    MUSCLE_GROUPS.slice(1).forEach(g=>{groups[g]=0});
    sessions.forEach(s=>{
      const d=new Date(s.date);
      if(d>=weekStart&&d<weekEnd){
        s.exercises.forEach(ex=>{
          const exInfo=EXERCISE_MAP[ex.exerciseId];
          const muscle=exInfo?exInfo.muscle:'Other';
          ex.sets.filter(st=>st.completed).forEach(st=>{
            groups[muscle]=(groups[muscle]||0)+(st.weight||0)*(st.reps||0);
          });
        });
      }
    });
    weeks.push({label:'W'+(8-i),groups});
  }

  const colors={Chest:'#FF6384',Back:'#36A2EB',Shoulders:'#FFCE56',Triceps:'#4BC0C0',Biceps:'#9966FF',Legs:'#FF9F40',Core:'#C9CBCF',Cardio:'#7CFC00'};
  const datasets=MUSCLE_GROUPS.slice(1).map(g=>({
    label:g,
    data:weeks.map(w=>Math.round(w.groups[g]||0)),
    backgroundColor:colors[g]||'#888',
  }));

  const ctx=document.getElementById('vol-chart');
  if(ctx){
    new Chart(ctx,{type:'bar',data:{labels:weeks.map(w=>w.label),datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'rgba(60,60,67,.55)',font:{size:10},boxWidth:10}}},scales:{x:{stacked:true,ticks:{color:'rgba(60,60,67,.45)'},grid:{color:'rgba(60,60,67,.08)'}},y:{stacked:true,ticks:{color:'rgba(60,60,67,.45)',callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v},grid:{color:'rgba(60,60,67,.08)'}}}}});
  }

  // Heatmap
  const heatmap=document.getElementById('heatmap');
  if(heatmap){
    const sessionDates=new Set(sessions.map(s=>new Date(s.date).toDateString()));
    const cells=[];
    for(let i=181;i>=0;i--){
      const d=new Date(today);d.setDate(today.getDate()-i);
      const trained=sessionDates.has(d.toDateString());
      // Count sessions on this day
      const count=sessions.filter(s=>new Date(s.date).toDateString()===d.toDateString()).length;
      const level=count===0?'':count===1?'l1':count===2?'l2':'l3';
      cells.push(`<div class="heatmap-cell ${level}" title="${d.toLocaleDateString()}"></div>`);
    }
    heatmap.innerHTML=cells.join('');
  }
}

/* ============================================================
   AUTH & INIT
   ============================================================ */
function showLoading(on){
  document.getElementById('loading-overlay').classList.toggle('show',on);
}

function showApp(){
  document.getElementById('welcome').classList.add('hide');
  document.getElementById('name-setup').classList.remove('show');
  document.getElementById('app').classList.add('show');
  const active=getActive();
  if(active&&active.startTime)startWorkoutTimer(active.startTime);
  renderHome();
}

function showAuth(){
  showLoading(false);
  document.getElementById('welcome').classList.remove('hide');
  document.getElementById('app').classList.remove('show');
}

async function signInWithGoogle(){
  try{
    if(window.location.protocol==='file:'){
      showToast('Open via http:// — run: python3 -m http.server 8080');
      return;
    }
    const{error}=await supa.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo:window.location.href}
    });
    if(error)showToast('Sign-in failed: '+error.message);
  }catch(e){showToast('Error: '+e.message)}
}

async function finishNameSetup(){
  const name=document.getElementById('setup-name').value.trim();
  if(!name)return;
  await setUserName(name);
  showApp();
}

function showProfileModal(){
  document.getElementById('profile-name-display').textContent=DB.userName||'User';
  document.getElementById('profile-email-display').textContent=DB.userEmail||'';
  document.getElementById('profile-unit').value=getUnit();
  document.getElementById('profile-modal').classList.add('show');
}

function closeProfileModal(){
  document.getElementById('profile-modal').classList.remove('show');
}

async function signOut(){
  closeProfileModal();
  await supa.auth.signOut();
  DB.sessions=[];DB.routines=[];DB.customExercises=[];DB.userId=null;DB.userName='';DB.userEmail='';
  rebuildExerciseMap();
  showAuth();
}

async function init(){
  rebuildExerciseMap();
  let session=null;
  try{
    const res=await withTimeout(supa.auth.getSession(),10000);
    session=res.data?.session||null;
  }catch(e){
    // getSession timed out or failed — show auth so user can sign in
    showAuth();
    return;
  }
  if(session){
    const loaded=await loadUserData(session.user);
    if(loaded&&!DB.userName){
      document.getElementById('welcome').classList.add('hide');
      document.getElementById('name-setup').classList.add('show');
    }else{
      showApp();
    }
  }else{
    showAuth();
  }
}

/* PROFILE FIELDS */
async function saveProfileField(field,value){
  if(!DB.userId)return;
  const update={};
  if(field==='gender')update.gender=value;
  if(field==='age')update.age=value;
  await supa.from('profiles').update(update).eq('id',DB.userId);
}

/* FEEDBACK */
function openFeedback(){document.getElementById('feedback-modal').classList.add('show')}
function closeFeedback(){document.getElementById('feedback-modal').classList.remove('show')}
async function submitFeedback(){
  const txt=document.getElementById('feedback-text').value.trim();
  if(!txt)return;
  await supa.from('feedback').insert({user_id:DB.userId||null,message:txt}).catch(()=>{});
  document.getElementById('feedback-text').value='';
  closeFeedback();
  showToast('Thanks for the feedback!');
}

// Re-sync rest timer when user returns to the app
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&timerEndAt>0){
    const remaining=Math.ceil((timerEndAt-Date.now())/1000);
    if(remaining<=0){skipTimer();showToast('Rest complete \u2014 next set!');}
    else{timerRemaining=remaining;updateTimerDisplay();}
  }
});

// Listen for auth state changes (handles OAuth redirect callback)
supa.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_IN'&&session&&!DB.userId){
    const loaded=await loadUserData(session.user);
    if(loaded&&!DB.userName){
      document.getElementById('welcome').classList.add('hide');
      document.getElementById('name-setup').classList.add('show');
    }else{
      showApp();
    }
  }
});

init();
</script>
