<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHOOP</title>
</head>
<body style="margin:0;background:#0d0d0f;color:#f2f2f2;font-family:-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center">
<div>
<h2 id="msg" style="margin:0 0 8px"></h2>
<p style="color:#999">This window will close itself.<br>If it doesn't, <a href="./" style="color:#e84040">return to Arnold</a>.</p>
</div>
<script>
var ok = new URLSearchParams(location.search).get('whoop') === 'connected';
var text = ok ? '✓ WHOOP connected' : 'WHOOP connection failed';
document.title = text;
document.getElementById('msg').textContent = text;
setTimeout(function(){ window.close(); }, 1500);
</script>
</body>
</html>
